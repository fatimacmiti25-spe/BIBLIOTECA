<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Préstamos - Biblioteca Escolar</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <!-- MENÚ LATERAL -->
    <aside class="menu">

        <div class="logo">

            <!-- Icono de libro -->
            <svg class="logo-icono" viewBox="0 0 24 24">
                <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5V5.5Z"/>
                <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5V5.5Z"/>
            </svg>

            <h2>Biblioteca<br>Escolar</h2>

        </div>


        <nav>

            <!-- INICIO -->
            <a href="index.html">

                <svg viewBox="0 0 24 24">
                    <path d="M3 11.5 12 4l9 7.5"/>
                    <path d="M5 10.5V20h5v-6h4v6h5v-9.5"/>
                </svg>

                Inicio
            </a>


            <!-- LIBROS -->
            <a href="libros.html">

                <svg viewBox="0 0 24 24">
                    <path d="M4 5a2 2 0 0 1 2-2h5v17H6a2 2 0 0 0-2 2V5Z"/>
                    <path d="M20 5a2 2 0 0 0-2-2h-5v17h5a2 2 0 0 1 2 2V5Z"/>
                </svg>

                Libros
            </a>


            <!-- PRÉSTAMOS -->
            <a href="prestamos.html" class="activo">

                <svg viewBox="0 0 24 24">
                    <path d="M4 6h11"/>
                    <path d="M4 10h11"/>
                    <path d="M4 14h7"/>
                    <path d="M16 13v7"/>
                    <path d="m13 17 3 3 3-3"/>
                </svg>

                Préstamos
            </a>


            <!-- DEVOLUCIONES -->
            <a href="devoluciones.html">

                <svg viewBox="0 0 24 24">
                    <path d="M9 7 4 12l5 5"/>
                    <path d="M4 12h10a6 6 0 0 1 6 6"/>
                </svg>

                Devoluciones
            </a>


            <!-- ALUMNOS -->
            <a href="alumnos.html">

                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/>
                </svg>

                Alumnos
            </a>


            <!-- INVENTARIO -->
            <a href="inventario.html">

                <svg viewBox="0 0 24 24">
                    <rect x="4" y="4" width="16" height="16" rx="2"/>
                    <path d="M8 8h8"/>
                    <path d="M8 12h8"/>
                    <path d="M8 16h5"/>
                </svg>

                Inventario
            </a>

        </nav>

    </aside>


    <!-- CONTENIDO -->
    <main class="contenido">

        <!-- ENCABEZADO -->
        <header>

            <h2>
                Sistema de Gestión de Biblioteca Escolar
            </h2>

            <div class="usuario">
                Usuario
            </div>

        </header>


        <!-- PÁGINA DE PRÉSTAMOS -->
        <section class="pagina">

            <h1>Préstamo de libros</h1>

            <p class="subtitulo">
                Registra la entrega de un libro a un alumno.
            </p>


            <!-- FORMULARIO -->
            <div class="formulario">


                <!-- MATRÍCULA -->
                <div class="campo">

                    <label for="matriculaPrestamo">
                        Matrícula del alumno
                    </label>

                    <input
                        type="text"
                        id="matriculaPrestamo"
                        placeholder="Ej. 2025001">

                </div>


                <!-- NOMBRE -->
                <div class="campo">

                    <label for="nombrePrestamo">
                        Nombre del alumno
                    </label>

                    <input
                        type="text"
                        id="nombrePrestamo"
                        placeholder="Ej. Ana López">

                </div>


                <!-- ID DEL LIBRO -->
                <div class="campo">

                    <label for="libroPrestamo">
                        ID del libro
                    </label>

                    <input
                        type="text"
                        id="libroPrestamo"
                        placeholder="Ej. LIB001">

                </div>


                <!-- TÍTULO -->
                <div class="campo">

                    <label for="tituloPrestamo">
                        Título del libro
                    </label>

                    <input
                        type="text"
                        id="tituloPrestamo"
                        placeholder="Ej. El Principito">

                </div>


                <!-- FECHA DE PRÉSTAMO -->
                <div class="campo">

                    <label for="fechaPrestamo">
                        Fecha de préstamo
                    </label>

                    <input
                        type="date"
                        id="fechaPrestamo">

                </div>


                <!-- FECHA LÍMITE -->
                <div class="campo">

                    <label for="fechaLimite">
                        Fecha límite de devolución
                    </label>

                    <input
                        type="date"
                        id="fechaLimite">

                </div>


                <!-- OBSERVACIONES -->
                <div class="campo campo-completo">

                    <label for="observacionesPrestamo">
                        Observaciones
                    </label>

                    <textarea
                        id="observacionesPrestamo"
                        placeholder="Escribe alguna observación si es necesario"></textarea>

                </div>


                <!-- BOTONES -->
                <div class="botones-formulario">

                    <button
                        type="button"
                        class="btn-principal"
                        id="registrarPrestamo">

                        Registrar préstamo

                    </button>


                    <button
                        type="reset"
                        class="btn-secundario">

                        Cancelar

                    </button>

                </div>

            </div>


            <!-- AVISO -->
            <div class="aviso">

                <strong>Importante:</strong>

                Antes de registrar el préstamo se debe verificar
                que el libro se encuentre disponible.

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
