    <main class="contenido">

        <header>

            <h2>Sistema de Gestión de Biblioteca Escolar</h2>

            <div class="usuario">
                Usuario
            </div>

        </header>


        <section class="pagina">

            <h1>Registro de libros</h1>

            <p class="subtitulo">
                Agrega nuevos ejemplares al inventario de la biblioteca.
            </p>


            <!-- FORMULARIO -->

            <div class="formulario">

                <div class="campo">
                    <label for="idLibro">ID del libro</label>

                    <input
                        type="text"
                        id="idLibro"
                        placeholder="Ej. LIB001">
                </div>


                <div class="campo">
                    <label for="titulo">Título</label>

                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ej. Cien años de soledad">
                </div>


                <div class="campo">
                    <label for="autor">Autor</label>

                    <input
                        type="text"
                        id="autor"
                        placeholder="Ej. Gabriel García Márquez">
                </div>


                <div class="campo">
                    <label for="editorial">Editorial</label>

                    <input
                        type="text"
                        id="editorial"
                        placeholder="Ej. Planeta">
                </div>


                <div class="campo">
                    <label for="edicion">Edición</label>

                    <input
                        type="text"
                        id="edicion"
                        placeholder="Ej. Primera edición">
                </div>


                <div class="campo">
                    <label for="anio">Año</label>

                    <input
                        type="number"
                        id="anio"
                        placeholder="Ej. 2024">
                </div>


                <div class="campo">

                    <label for="categoria">Categoría</label>

                    <select id="categoria">

                        <option value="">
                            Selecciona una categoría
                        </option>

                        <option>Literatura</option>
                        <option>Ciencia</option>
                        <option>Tecnología</option>
                        <option>Historia</option>
                        <option>Matemáticas</option>
                        <option>Otros</option>

                    </select>

                </div>


                <div class="campo">

                    <label for="condicion">Condición</label>

                    <select id="condicion">

                        <option>Buena</option>
                        <option>Regular</option>
                        <option>Mala</option>

                    </select>

                </div>


                <div class="botones-formulario">

                    <button
                        type="button"
                        class="btn-principal"
                        id="guardarLibro">

                        Guardar

                    </button>


                    <button
                        type="reset"
                        class="btn-secundario">

                        Cancelar

                    </button>

                </div>

            </div>


            <!-- LIBROS REGISTRADOS -->

            <div class="seccion-tabla">

                <div class="encabezado-tabla">

                    <h2>Libros registrados</h2>

                    <input
                        type="text"
                        id="buscarLibro"
                        placeholder="Buscar libro..."
                        class="buscador">

                </div>


                <div class="tabla-contenedor">

                    <table>

                        <thead>

                            <tr>
                                <th>ID</th>
                                <th>Título</th>
                                <th>Autor</th>
                                <th>Editorial</th>
                                <th>Año</th>
                                <th>Categoría</th>
                                <th>Condición</th>
                                <th>Acciones</th>
                            </tr>

                        </thead>


                        <tbody id="tablaLibros">

                            <!-- Los libros registrados aparecerán aquí -->

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
